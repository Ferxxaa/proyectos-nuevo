<app-main></app-main>

<div class="content-wrap">
  <main id="content" role="main" class="content">
    <section class="widget">
      <header class="cartas-gantt-cabecera">
        <div>
          <span class="cartas-gantt-kicker">CONTROL DE AVANCE PROYECTOS</span>
          <h2><strong>Cartas Gantt seleccionadas</strong></h2>
        </div>
        <a class="btn btn-volver-cartas" [routerLink]="['/Proyectos-MisProyectos']">
          <i class="fa fa-arrow-left"></i>
          <span>Volver</span>
        </a>
      </header>
      <div class="widget-body">
        <div class="loader" *ngIf="cargando">
          <span class="spinner"><i class="fa fa-spinner fa-spin"></i></span>
        </div>

        <div class="alert alert-info" *ngIf="!cargando && cartasGantt.length === 0">
          Selecciona uno o más sub-proyectos desde Mis Proyectos para ver sus cartas Gantt.
        </div>

        <div class="grupos-cartas-gantt" *ngIf="!cargando && cartasGantt.length">
          <section class="grupo-cartas-gantt" *ngFor="let grupo of gruposCartasGantt">
            <button type="button" class="grupo-cartas-titulo" (click)="alternarGrupo(grupo)"
              [attr.aria-expanded]="grupo.expandido">
              <span class="grupo-cartas-nombre">
                <i class="fa" [class.fa-chevron-down]="grupo.expandido" [class.fa-chevron-right]="!grupo.expandido"></i>
                <strong>{{ grupo.nombreProyecto }}</strong>
                <small>Proyecto {{ grupo.idProyecto }}</small>
              </span>
              <span class="grupo-cartas-contador">{{ grupo.cartas.length }} subproyecto{{ grupo.cartas.length === 1 ? '' : 's' }}</span>
            </button>
            <div class="cartas-gantt-lista" *ngIf="grupo.expandido">
              <div class="carta-gantt-arrastrable"
                *ngFor="let carta of grupo.cartas; let indice = index"
                draggable="true"
                (dragstart)="iniciarArrastre(grupo, indice, $event)"
                (dragover)="permitirSoltar($event)"
                (drop)="soltarCarta(grupo, indice, $event)"
                (dragend)="terminarArrastre()">
                <div class="carta-gantt-manija" title="Arrastrar carta" aria-label="Arrastrar carta">
                  <i class="fa fa-arrows"></i>
                </div>
                <div class="carta-gantt-contenido">
                  <button type="button" class="carta-gantt-titulo" (click)="alternarCarta(carta)"
                    [class.carta-gantt-titulo-abierto]="carta.expandida"
                    [attr.aria-expanded]="carta.expandida"
                    [attr.aria-label]="(carta.expandida ? 'Ocultar' : 'Ver') + ' control de avance de ' + carta.subProyecto.nombreSubProyecto">
                    <span class="carta-gantt-nombre">
                      <i class="fa" [class.fa-chevron-down]="carta.expandida" [class.fa-chevron-right]="!carta.expandida"></i>
                      <span class="carta-gantt-etiqueta">CONTROL DE AVANCE</span>
                      <strong>{{ carta.subProyecto.nombreSubProyecto }}</strong>
                    </span>
                    <span class="carta-gantt-accion">
                      <i class="fa" [class.fa-eye-slash]="carta.expandida" [class.fa-eye]="!carta.expandida"></i>
                      {{ carta.expandida ? 'Ocultar control' : 'Ver control' }}
                    </span>
                  </button>
                  <app-control-avance
                    *ngIf="carta.expandida"
                    [idProyecto]="carta.subProyecto.idProyecto"
                    [idSubProyecto]="carta.subProyecto.idSubProyecto"
                    [nombreProyecto]="carta.subProyecto.nombreSubProyecto"
                    [detalleSeguimiento]="carta.detalleSeguimiento"
                    [soloLectura]="false"
                    [ocultarTitulo]="true"
                    [ocultarFiltros]="true"
                    [ocultarExportacion]="false"
                      [vistaInicial]="'gantt'"
                      class="cartas-gantt-compacto">
                  </app-control-avance>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>
</div>
