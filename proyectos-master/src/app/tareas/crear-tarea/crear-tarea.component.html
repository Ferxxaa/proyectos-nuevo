<app-main></app-main>

<div class="content-wrap">
  <main id="content" role="main" class="content">
    <div class="row">
      <div class="col-lg-12">
        <section class="widget">
          <header style="background-color: #555555">
            <h2 style="color: white;">
              <strong>Crear Tareas</strong>
            </h2>
          </header>
          <div class="widget-body">
            
            <div class="form-group row">
              <div class="col-md-offset-10 col-md-2">
                <a class="btn btn-inverse" [routerLink]="['/Ver-Tareas']">Volver</a>
              </div>
            </div>
            <form #CForm="ngForm" (ngSubmit)="Agregar(CForm)">
              <fieldset>
                <legend></legend>
                <div class="form-group row">
                  <label for="normal-field" class="col-md-2 form-control-label h5">Responsable(*):</label>
                  <div class="col-md-4">
                    <div class="cc-gmail" (click)="abrirDropdownResponsable()">
                      <input
                        type="text"
                        class="cc-input"
                        placeholder="Buscar responsable por nombre"
                        [ngModel]="responsableBusqueda"
                        [ngModelOptions]="{standalone: true}"
                        (ngModelChange)="onResponsableBusquedaChange($event)"
                        (focus)="abrirDropdownResponsable()"
                        (blur)="cerrarDropdownResponsable()"
                      />
                    </div>

                    <div class="cc-dropdown" *ngIf="responsableDropdownAbierto">
                      <div class="cc-option" *ngFor="let Responsable of getResponsablesFiltrados()" (mousedown)="seleccionarResponsable(Responsable)">
                        {{Responsable.nombre + ' ' + Responsable.paterno}}
                      </div>
                    </div>

                    <select name="drdResponsableTar" id="drdResponsableTar" class="dropdown-toggle select2-chosen-2 form-control requiered"
                      style="display: none;"
                      appSelectValidator [(ngModel)]="Tarea.idUsuarioResponsable">
                      <option value=0 selected>--- Seleccione una opcion ---</option>
                      <option *ngFor="let Responsable of Responsables | arrDisting:['idUsuario','nombre']" value={{Responsable.idUsuario}}>{{Responsable.nombre + ' ' + Responsable.paterno}}
                      </option>
                    </select>
                  </div>
                  <label for="normal-field" class="col-md-2 form-control-label h5">CC:</label>
                  <div class="col-md-4">
                    <div class="cc-gmail" (click)="abrirDropdownCC()">
                      <span class="cc-chip" *ngFor="let idUsuarioCC of UsuariosCCSeleccionados">
                        {{obtenerNombreUsuarioCC(idUsuarioCC)}}
                        <button type="button" class="cc-chip-remove" (click)="removerUsuarioCC(idUsuarioCC); $event.stopPropagation();">×</button>
                      </span>

                      <input
                        type="text"
                        class="cc-input"
                        placeholder="Agregar personas en CC"
                        [(ngModel)]="ccBusqueda"
                        [ngModelOptions]="{standalone: true}"
                        (focus)="abrirDropdownCC()"
                        (blur)="cerrarDropdownCC()"
                        [disabled]="(UsuariosCCSeleccionados || []).length >= maxUsuariosCC"
                      />
                    </div>

                    <div class="cc-dropdown" *ngIf="ccDropdownAbierto && (UsuariosCCSeleccionados || []).length < maxUsuariosCC">
                      <div class="cc-option" *ngFor="let Usuario of getUsuariosCCFiltrados()" (mousedown)="agregarUsuarioCC(Usuario.idUsuario)">
                        {{Usuario.nombre + ' ' + Usuario.paterno}}
                      </div>
                    </div>

                    <small class="text-muted">Puedes seleccionar hasta 6 personas.</small>
                  </div>
                </div>
                <div class="form-group row">
                  <label for="normal-field" class="col-md-2 form-control-label h5">Prioridad(*):</label>
                  <div class="col-md-4">
                    <select name="drdPrioridadTar" id="drdPrioridadTar" class="dropdown-toggle select2-chosen-2 form-control requiered"
                      appSelectValidator [(ngModel)]="Tarea.prioridad">
                      <option value="0" selected>--- Seleccione una opcion ---</option>
                      <option value="Alta">Alta</option>
                      <option value="Media">Media</option>
                      <option value="Baja">Baja</option>
                    </select>
                  </div>
                  <label for="normal-field" class="col-md-2 form-control-label h5">Area(*):</label>
                  <div class="col-md-4">
                    <select name="drdArea" id="drdArea" class="dropdown-toggle select2-chosen-2 form-control requiered"
                      appSelectValidator [(ngModel)]="Tarea.area">
                      <option value="0" selected>--- Seleccione una opcion ---</option>
                      <option *ngFor="let Area of Areas" value={{Area.idArea}}>{{Area.nombre}}</option>
                    </select>
                  </div>
                </div>
                <div class="form-group row">
                  <div class="col-md-12">
                    <textarea name="tbxTarea" rows="2" cols="20" id="tbxTarea" class="form-control" style="height:200px;"
                      [(ngModel)]="Tarea.descripcionTarea"></textarea>
                  </div>
                </div>
              </fieldset>
              <div class="form-actions">
                <div class="row">
                  <div class="col-md-offset-4 col-md-8">
                    <input type="submit" name="btnAsignar" value="Asignar" id="btnAsignar" class="btn btn-success"
                      [disabled]="!CForm.valid">
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="loader animated fadeIn handle" *ngIf="Loading">
            <span class="spinner">
              <i class="fa fa-spinner fa-spin"></i>
            </span>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
