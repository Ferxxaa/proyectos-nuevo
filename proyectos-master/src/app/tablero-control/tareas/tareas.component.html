<section class="tar">
  <header class="tar-encabezado">
    <span class="tar-icono"><i class="fa fa-check-square-o" aria-hidden="true"></i></span>
    <div class="tar-titulo">
      <h5>Asignar Tareas</h5>
      <p>{{SubProyecto.nombreSubProyecto}}</p>
    </div>
  </header>

  <form #CForm="ngForm" (ngSubmit)="Agregar(CForm)" class="tar-panel">
    <h6>Nueva tarea</h6>
    <div class="tar-cuerpo">
      <div class="tar-campos">
        <div class="tar-campo">
          <label for="drdResponsableTar">Para (*)</label>
          <select name="drdResponsableTar" id="drdResponsableTar" class="form-control requiered"
            appSelectValidator [(ngModel)]="Tarea.idUsuarioResponsable">
            <option value=0 selected>--- Seleccione una opción ---</option>
            <option *ngFor="let Responsable of Responsables | arrDisting:['idUsuario','nombre']" value={{Responsable.idUsuario}}>{{Responsable.nombre + ' ' + Responsable.paterno}}</option>
          </select>
        </div>

        <div class="tar-campo">
          <label for="drdCC">CC</label>
          <div class="tar-campo-accion">
            <select name="drdCC" id="drdCC" class="form-control">
              <option value=0 selected>--- Seleccione una opción ---</option>
              <option *ngFor="let Responsable of Responsables | arrDisting:['idUsuario','nombre']" value={{Responsable.idUsuario}}>{{Responsable.nombre + ' ' + Responsable.paterno}}</option>
            </select>
            <input type="submit" name="btnAgregar" value="Agregar" id="btnAgregar" class="tar-boton">
          </div>
          <span id="lblCC" class="tar-cc"></span>
        </div>

        <div class="tar-campo">
          <label for="drdPrioridadTar">Prioridad (*)</label>
          <select name="drdPrioridadTar" id="drdPrioridadTar" class="form-control requiered"
            appSelectValidator [(ngModel)]="Tarea.prioridad">
            <option value="0" selected>--- Seleccione una opción ---</option>
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Baja">Baja</option>
          </select>
        </div>

        <div class="tar-campo">
          <label for="drdArea">Área (*)</label>
          <select name="drdArea" id="drdArea" class="form-control requiered"
            appSelectValidator [(ngModel)]="Tarea.area">
            <option value="0" selected>--- Seleccione una opción ---</option>
            <option *ngFor="let Area of Areas" value={{Area.idArea}}>{{Area.nombre}}</option>
          </select>
        </div>

        <div class="tar-campo tar-campo-ancho">
          <label for="tbxTarea">Descripción de la tarea</label>
          <textarea name="tbxTarea" rows="6" id="tbxTarea" class="form-control"
            [(ngModel)]="Tarea.descripcionTarea"></textarea>
        </div>
      </div>

      <div class="tar-acciones">
        <input type="button" name="btnLimpiar" value="Limpiar" id="btnLimpiar1" class="tar-boton">
        <input type="submit" name="btnAsignar" value="Asignar" id="btnAsignar" class="tar-boton-principal" [disabled]="!CForm.valid">
      </div>
    </div>
  </form>
</section>
