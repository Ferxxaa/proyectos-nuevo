<div class="bgPop">
  <div class="contenido">
    <div class="row">
      <div class="col-12">
        Adjuntar archivo
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="fileinput fileinput-new input-group" data-provides="fileinput">
          <div class="form-control" data-trigger="fileinput">
              <i class="glyphicon glyphicon-file fileinput-exists"></i>
              <span class="fileinput-filename" id="NombreArch"></span>
          </div>
          <span class="input-group-addon btn btn-secondary btn-file">
          <span class="fileinput-new">Adjuntar</span>
          <span class="fileinput-exists">Change</span>
          <input id="fileupload1" type="file" name="fileupload1" (change)="NombreArchivo()">
          </span>
        </div>
      </div>
    </div>
    <div class="row acciones">
      <button class="btn btn-primary" [disabled]="disable" (click)="guardar(archivoEstandar)">Agregar</button>
      <button class="btn btn-reverse" (click)="cerrarEvent()">Cerrar</button>
    </div>
  </div>
</div>
