<section class="widget standards-library">
  <header class="standards-library-header">
    <div>
      <h5><i class="fa fa-folder-open" aria-hidden="true"></i> Archivos estándares</h5>
      <small>Consulta y descarga documentos del proyecto</small>
    </div>
  </header>
  <div class="widget-body">
    <fieldset class="standards-library-list">
      <legend></legend>

      <div class="panel panel-default standard-category" *ngFor="let panel of paneles">
        <div class="panel-heading standard-category-heading">
          <div class="standard-category-main">
            <a class="collapsed standard-category-toggle" data-toggle="collapse" data-parent="#accordion"
              [attr.href]="'#' + panel.id" aria-expanded="false"
              (click)="CargaArchivos(panel.id, panel.tipo)">
              <span class="standard-category-icon"><i class="fa fa-file-text-o" aria-hidden="true"></i></span>
              <span class="standard-category-title">{{panel.titulo}}</span>
              <i class="fa fa-chevron-down standard-category-chevron" aria-hidden="true"></i>
            </a>
          </div>
          <button type="button" class="standard-add" *ngIf="!soloLectura" (click)="verPupUp(panel.tipo)"
            [attr.aria-label]="'Agregar archivo a ' + panel.titulo" title="Agregar archivo">
            <i class="fa fa-plus" aria-hidden="true"></i>
          </button>
        </div>
        <div [id]="panel.id" class="panel-collapse collapse" aria-expanded="false">
          <div class="panel-body standard-category-body">
            <div class="standard-empty" *ngIf="open === panel.tipo && !(Archivos$ | async)?.length">
              <i class="fa fa-folder-open-o" aria-hidden="true"></i>
              <span>No hay archivos en esta categoría.</span>
            </div>
            <table class="table table-hover no-footer standard-files-table" *ngIf="open === panel.tipo && (Archivos$ | async)?.length">
              <thead>
                <tr>
                  <th scope="col">Archivo</th>
                  <th scope="col" class="standard-actions-heading">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let archivo of Archivos$ | async">
                  <td>
                    <a class="standard-file-link" [href]="linkDescarga(archivo)" target="_blank">
                      <i class="fa fa-file-o" aria-hidden="true"></i>
                      <span>{{archivo.nombreArchivo}}</span>
                    </a>
                    <i *ngIf="archivo.urlFirebase" class="fa fa-cloud standard-cloud-icon"
                      title="Respaldado en Firebase" aria-label="Respaldado en Firebase"></i>
                  </td>
                  <td class="standard-actions">
                    <a class="standard-download" [href]="linkDescarga(archivo)" target="_blank" title="Abrir o descargar archivo"
                      aria-label="Abrir o descargar archivo">
                      <i class="fa fa-download" aria-hidden="true"></i>
                    </a>
                    <button type="button" class="standard-delete" (click)="eliminar(archivo)" *ngIf="admin()"
                      title="Eliminar archivo" aria-label="Eliminar archivo">
                      <i class="fa fa-trash-o" aria-hidden="true"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </fieldset>
  </div>
</section>


<app-agregar-archivo-estandar *ngIf="archivoEstandar" [archivoEstandar]="archivoEstandar" (cerrar)="cerrarpopUp($event)"></app-agregar-archivo-estandar>
